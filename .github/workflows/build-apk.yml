name: Build VK Insight APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project archive
        run: |
          unzip VKInsight_Android_Project_with_APK_build.zip -d extracted
          cp -R extracted/VKInsight/app .
          cp extracted/VKInsight/build.gradle.kts .
          cp extracted/VKInsight/settings.gradle.kts .
          cp extracted/VKInsight/gradle.properties .

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VKInsight-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
